name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master", "feature/db-linup" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      dependency_versions: '["prefer-lowest","prefer-stable"]'
      php_extensions: "pdo, pdo_mysql, pdo_pgsql, pdo_sqlite"
      composer_flags: ""
      phpstan_memory_limit: "1G"
      psalm_threads: "1"
      run_analysis: true
      run_svg_report: true
      fail_on_skipped_tests: false
      enable_redis_service: false
      enable_valkey_service: false
      enable_memcached_service: false
      enable_postgres_service: true
      enable_mysql_service: true
      enable_scylladb_service: false
      enable_elasticsearch_service: false
      enable_mongodb_service: false
      service_db_name: "dblayer"
      service_db_user: "dblayer"
      service_db_password: "dblayer"
      artifact_retention_days: 61

  mariadb:
    name: "MariaDB / PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dblayer
          MARIADB_USER: dblayer
          MARIADB_PASSWORD: dblayer
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo, pdo_mysql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run SQLite and MariaDB integration suite
        env:
          DBLAYER_MARIADB_HOST: 127.0.0.1
          DBLAYER_MARIADB_PORT: 3306
          DBLAYER_MARIADB_DATABASE: dblayer
          DBLAYER_MARIADB_USERNAME: dblayer
          DBLAYER_MARIADB_PASSWORD: dblayer
        run: composer ic:test:code

  mssql:
    name: "Microsoft SQL Server / PHP ${{ matrix.php }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: "DBLayer_Strong!2026"
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo, pdo_sqlsrv, pdo_sqlite
          coverage: none
      - name: Initialize SQL Server test database
        env:
          MSSQL_SA_PASSWORD: "DBLayer_Strong!2026"
        run: |
          php -r '
          $deadline = microtime(true) + 90;
          do {
              try {
                  $pdo = new PDO(
                      "sqlsrv:Server=127.0.0.1,1433;Database=master;Encrypt=yes;TrustServerCertificate=yes;LoginTimeout=2",
                      "sa",
                      getenv("MSSQL_SA_PASSWORD"),
                      [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
                  );
                  $pdo->exec("IF DB_ID(N\x27dblayer\x27) IS NULL CREATE DATABASE [dblayer]");
                  exit(0);
              } catch (Throwable $e) {
                  if (microtime(true) >= $deadline) {
                      fwrite(STDERR, $e->getMessage() . PHP_EOL);
                      exit(1);
                  }
                  usleep(2_000_000);
              }
          } while (true);
          '
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run SQLite and Microsoft SQL Server integration suite
        env:
          DBLAYER_MSSQL_HOST: 127.0.0.1
          DBLAYER_MSSQL_PORT: 1433
          DBLAYER_MSSQL_DATABASE: dblayer
          DBLAYER_MSSQL_USERNAME: sa
          DBLAYER_MSSQL_PASSWORD: "DBLayer_Strong!2026"
          DBLAYER_MSSQL_ENCRYPT: "true"
          DBLAYER_MSSQL_TRUST_SERVER_CERTIFICATE: "true"
        run: composer ic:test:code
