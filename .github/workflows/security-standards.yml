name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      php_versions: '["8.4","8.5"]'
      php_extensions: "pdo, pdo_mysql, pdo_pgsql, pdo_sqlite, pdo_sqlsrv"
      integration_services: '["mysql","mariadb","postgres","mssql","sqlite"]'
      service_topologies: '{"mysql":"replica","mariadb":"replica","postgres":"replica","mssql":"availability-group"}'
      service_db_name: "dblayer"
      service_db_user: "dblayer"
      service_password: "DBLayer_Strong!2026"
