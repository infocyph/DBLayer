name: "PHPForge Test Details"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/db-linup"]
  workflow_dispatch:

jobs:
  test-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Syntax
        continue-on-error: true
        run: composer ic:test:syntax
      - name: Code tests
        continue-on-error: true
        run: composer ic:test:code
      - name: Pint
        continue-on-error: true
        run: composer ic:test:lint
      - name: PHPCS
        continue-on-error: true
        run: composer ic:test:sniff
      - name: Duplicates
        continue-on-error: true
        run: composer ic:test:duplicates
      - name: Comments
        continue-on-error: true
        run: composer ic:test:comments
      - name: Architecture
        continue-on-error: true
        run: composer ic:test:architecture
      - name: PHPStan
        continue-on-error: true
        run: composer ic:test:static
      - name: Psalm security
        continue-on-error: true
        run: composer ic:test:security
      - name: Rector
        continue-on-error: true
        run: composer ic:test:refactor
