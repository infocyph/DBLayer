name: "PHPForge Test Details"

on:
  push:
    branches: ["feature/db-linup"]
  workflow_dispatch:

jobs:
  test-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run PHPForge detailed tests
        run: composer ic:test:details
