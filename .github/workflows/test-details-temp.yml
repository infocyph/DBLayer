name: "PHPForge Duplicate Diagnostics"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/db-linup"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  duplicates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run duplicate-code gate
        shell: bash
        run: |
          set +e
          composer ic:test:duplicates 2>&1 | tee /tmp/duplicates.log
          status=${PIPESTATUS[0]}
          echo "DUPLICATE_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Publish complete duplicate report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ic-duplicates-diagnostic -->';
            const text = fs.readFileSync('/tmp/duplicates.log', 'utf8');
            const bodyText = text.slice(-60000).replace(/```/g, '```\u200b');
            const body = `${marker}\nComplete \`composer ic:test:duplicates\` report:\n\n\`\`\`text\n${bodyText}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Preserve duplicate gate result
        shell: bash
        run: exit "$DUPLICATE_STATUS"
