name: "PHPForge Test Details"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/db-linup"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Run exact PHPForge detailed suite
        shell: bash
        run: |
          set +e
          composer ic:tests:details 2>&1 | tee /tmp/ic-tests-details.log
          status=${PIPESTATUS[0]}
          echo "IC_TESTS_STATUS=$status" >> "$GITHUB_ENV"
          exit 0
      - name: Extract exact failure context
        shell: bash
        run: |
          {
            echo '--- FIRST OUTPUT ---'
            sed -n '1,500p' /tmp/ic-tests-details.log
            echo '--- FAILURE CONTEXT ---'
            grep -n -B 8 -A 20 -Ei 'fail(ed|ure)?|error|exception|invalid|violation|not normalized|would normalize|exit code|returned with error' /tmp/ic-tests-details.log | head -n 1200 || true
            echo '--- LAST OUTPUT ---'
            tail -n 300 /tmp/ic-tests-details.log
          } > /tmp/ic-tests-details-diagnostic.log
      - name: Publish exact failure output
        if: env.IC_TESTS_STATUS != '0' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ic-tests-details-diagnostic -->';
            const text = fs.existsSync('/tmp/ic-tests-details-diagnostic.log')
              ? fs.readFileSync('/tmp/ic-tests-details-diagnostic.log', 'utf8')
              : 'The detailed test command failed before producing a captured diagnostic.';
            const bodyText = text.slice(0, 60000).replace(/```/g, '```\u200b');
            const body = `${marker}\nExact \`composer ic:tests:details\` diagnostic:\n\n\`\`\`text\n${bodyText}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, per_page: 100 });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
      - name: Preserve exact suite result
        shell: bash
        run: exit "$IC_TESTS_STATUS"
