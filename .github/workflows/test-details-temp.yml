name: "PHPForge Pint Repair"

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pint-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/db-linup
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, pdo_pgsql, pdo_sqlite
          coverage: none
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: highest
      - name: Apply Pint to reported files
        shell: bash
        run: |
          vendor/bin/pint src/Driver/MariaDB/MariaDBCompiler.php src/Driver/MySQL/MySQLCompiler.php src/Schema/SchemaColumnCompiler.php
          git diff --check
      - name: Commit Pint repairs
        shell: bash
        run: |
          if git diff --quiet -- src/Driver/MariaDB/MariaDBCompiler.php src/Driver/MySQL/MySQLCompiler.php src/Schema/SchemaColumnCompiler.php; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Driver/MariaDB/MariaDBCompiler.php src/Driver/MySQL/MySQLCompiler.php src/Schema/SchemaColumnCompiler.php
          git commit -m "Fix PHPForge Pint violations"
          git push origin HEAD:feature/db-linup
