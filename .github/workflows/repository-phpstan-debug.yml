name: "Repository PHPStan Debug"

on:
  pull_request:
    branches: ["main"]

jobs:
  phpstan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: "pdo, pdo_sqlite"
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPStan diagnostics
        shell: bash
        run: |
          vendor_dir="$(composer config vendor-dir)"
          config="$vendor_dir/infocyph/phpforge/resources/phpstan.neon.dist"
          set +e
          php "$vendor_dir/bin/phpstan" analyse --configuration="$config" --memory-limit=1G --no-progress --error-format=json > phpstan-results.json
          status=$?
          set -e
          php -r '$r=json_decode(file_get_contents("phpstan-results.json"), true); foreach (($r["files"] ?? []) as $file => $data) { foreach (($data["messages"] ?? []) as $m) { printf("%s:%d: %s [%s]\n", $file, $m["line"] ?? 0, $m["message"] ?? "", $m["identifier"] ?? ""); } }'
          exit "$status"
